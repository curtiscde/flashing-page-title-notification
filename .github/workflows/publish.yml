name: Publish

# Publishes to npm when the version in package.json isn't on npm yet,
# then tags vX.Y.Z and creates a GitHub Release. Bump the version in a PR
# to release; merges that don't change it publish nothing.

on:
  push:
    branches: [ main ]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # tag + GitHub Release
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Check whether this version is already published
      id: version
      run: |
        name=$(node -p "require('./package.json').name")
        version=$(node -p "require('./package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if npm view "$name@$version" version >/dev/null 2>&1; then
          echo "$name@$version is already on npm, skipping"
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.version.outputs.publish == 'true'
      run: npm ci

    - if: steps.version.outputs.publish == 'true'
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
        npm run check-package

    - if: steps.version.outputs.publish == 'true'
      run: npm publish --provenance --access public

    - if: steps.version.outputs.publish == 'true'
      name: Tag and create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
