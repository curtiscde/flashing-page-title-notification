name: Publish

# semantic-release reads the conventional commits since the last tag:
# feat → minor, fix → patch, BREAKING CHANGE / feat! → major, anything else
# → no release. On a release it publishes to npm (Trusted Publishing, with
# provenance), commits the version + CHANGELOG back to main, tags vX.Y.Z and
# creates a GitHub Release. Config: .releaserc.json
#
# semantic-release runs via npx, pinned here rather than in devDependencies:
# its bundled npm and dependency tree carry audit findings that would
# otherwise land in our lockfile. Keep this filename: npm's Trusted
# Publisher is registered against publish.yml.

on:
  push:
    branches: [ main ]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # release commit, tag, GitHub Release
      issues: write # @semantic-release/github
      pull-requests: write # @semantic-release/github
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # semantic-release needs the full history and tags

    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - run: npm ci

    - run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
        npm run check-package

    - name: Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        npx --yes
        -p semantic-release@25.0.9
        -p @semantic-release/changelog@7.0.0
        -p @semantic-release/git@11.0.1
        -p conventional-changelog-conventionalcommits@10.4.0
        semantic-release
