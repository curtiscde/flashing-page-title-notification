name: PR title

# PRs are squash-merged with the PR title as the commit message, and
# semantic-release reads those messages to decide the next version, so the
# title must be a conventional commit: feat: …, fix: …, chore(deps): …

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ github.token }}
